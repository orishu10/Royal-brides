name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: royalbrides_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # build doesn't touch the DB, but env() validation needs values
          DATABASE_URL: postgres://rb:rb@localhost:5432/royalbrides_test
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          ADMIN_NOTIFY_EMAIL: admin@example.com
